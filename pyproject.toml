[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing-diff"
version = "0.1.0"
description = "Compare two engineering drawing PDFs and report what changed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sagar Shedage" }]
keywords = ["cad", "pdf", "engineering-drawing", "diff", "revision-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    "PyMuPDF>=1.24.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
drawing-diff = "drawingdiff.cli:main"

[tool.setuptools]
packages = ["drawingdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
